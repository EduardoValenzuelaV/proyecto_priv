<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;background:#f7efe2;color:#22305a;font-family:'DM Sans';overflow-x:hidden;padding:14px}
.border{border:12px solid transparent;border-image:repeating-linear-gradient(135deg,#d1343f 0 14px,#f7efe2 14px 24px,#3d72c4 24px 38px,#f7efe2 38px 48px) 12;background:#fffaf2;padding:22px 18px 28px;position:relative}
.stamp{position:absolute;top:18px;right:18px;width:96px;background:#fffdf8;padding:6px;border:2px dotted #3d72c4;transform:rotate(4deg)}
.stamp img{width:100%;display:block}
.stamp small{display:block;text-align:center;font-size:10px;font-weight:700;color:#d1343f;margin-top:2px}
.pm{position:absolute;top:30px;right:96px;width:88px;height:88px;border:2px solid #22305a99;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:'Special Elite';font-size:10px;line-height:1.2;transform:rotate(-14deg);color:#22305a99}
.air{font-family:'Special Elite';font-size:13px;color:#d1343f;margin-top:128px}
h1{font-family:Fraunces;font-weight:600;font-size:46px;line-height:1;margin:8px 0 14px;letter-spacing:-1px}
h1 i{font-weight:400;color:#d1343f}
.addr{font-family:Caveat;font-size:26px;line-height:1.3;border-top:2px solid #22305a22;padding-top:12px}
.addr span{display:block;border-bottom:1px solid #22305a33;padding-bottom:2px;margin-bottom:6px}
.letter{margin-top:26px;border:1px solid #ece0cf;padding:20px;box-shadow:0 14px 26px -16px #22305a66;transform:rotate(-1deg);background-color:#fffdf8;background-image:repeating-linear-gradient(transparent 0 27px,#3d72c422 27px 28px)}
.letter p{font-family:Caveat;font-size:23px;line-height:28px}
.letter b{display:block;text-align:right;font-family:Caveat;font-size:26px;color:#d1343f;margin-top:6px}
.row{display:flex;gap:10px;margin-top:22px}
.row div{flex:1;text-align:center;padding:12px 4px;background:#e4edfb;border-radius:10px}
.row b{font-family:Fraunces;font-size:28px;display:block;color:#3d72c4}
.row span{font-size:12px}
</style>
<div class=border>
<div class=stamp><img src="../../assets/stickers/stikers3.png"><small>AMOR · 1° MES</small></div>
<div class=pm>CONCEPCIÓN<br>CHILE<br>17 OCT 26</div>
<div class=air>POR AVIÓN · PAR AVION</div>
<h1>Para <i>Dallana</i></h1>
<div class=addr><span>Un detalle hecho a mano,</span><span>con todo mi amor,</span><span>desde Concepción.</span></div>
<div class=letter><p>Dallana, gracias por cada paseo, cada conversación y cada risa. Te elegiría una y mil veces.</p><b>— tu Eduardo ♡</b></div>
<div class=row><div><b>33</b><span>días</span></div><div><b>12</b><span>recuerdos</span></div><div><b>1</b><span>carta</span></div></div>
</div>

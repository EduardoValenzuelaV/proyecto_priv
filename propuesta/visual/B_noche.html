<!doctype html><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;background:#1d1220;color:#f6e9dc;font-family:'DM Sans';overflow-x:hidden;background-image:radial-gradient(circle at 80% 8%,#5b1d33 0,transparent 55%)}
.top{display:flex;justify-content:space-between;padding:22px 22px 0;font-size:13px;color:#c9a88f}
.hero{padding:26px 22px 0;position:relative}
h1{font-family:'Instrument Serif';font-weight:400;font-size:96px;line-height:.86;letter-spacing:-2px}
h1 i{color:#ff9e8f}
.sub{font-family:Caveat;font-size:24px;color:#e8b7a4;margin-top:12px}
.frame{margin:26px -22px 0;height:330px;position:relative;overflow:hidden}
.frame img.ph{width:100%;height:100%;object-fit:cover;filter:sepia(.25) saturate(1.1) contrast(1.05)}
.frame:after{content:"";position:absolute;inset:0;background:linear-gradient(#1d1220 0,transparent 25%,transparent 60%,#1d1220 100%)}
.st{position:absolute;width:110px;right:16px;bottom:-4px;z-index:2;filter:drop-shadow(0 8px 14px #0008)}
.stats{display:flex;gap:10px;padding:0 22px;margin-top:-6px;position:relative;z-index:3}
.stats div{flex:1;border:1px solid #ffffff22;border-radius:14px;padding:12px;background:#ffffff0a}
.stats b{font-family:'Instrument Serif';font-size:34px;color:#ff9e8f;display:block;line-height:1;font-weight:400}
.stats span{font-size:12px;color:#c9a88f}
.film{margin-top:36px;background:#0e0710;padding:14px 0;position:relative}
.film:before,.film:after{content:"";position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#1d1220 0 10px,transparent 10px 20px)}
.film:before{top:3px}.film:after{bottom:3px}
.strip{display:flex;gap:10px;padding:14px 22px;overflow:hidden}
.strip div{flex:0 0 130px;height:170px;border-radius:3px;position:relative}
.strip em{position:absolute;bottom:6px;left:8px;font-family:Caveat;font-style:normal;font-size:17px;color:#fff}
.sec{padding:34px 22px 40px}
.sec h2{font-family:'Instrument Serif';font-weight:400;font-size:38px}
.sec p{color:#c9a88f;font-size:15px;line-height:1.5;margin-top:8px;max-width:30ch}
.btn{display:inline-block;margin-top:18px;background:#ff9e8f;color:#2a0e18;font-weight:700;padding:13px 22px;border-radius:999px;font-size:15px}
</style>
<div class=top><span>Edición especial</span><span>17 · 10 · 2026</span></div>
<div class=hero><h1>Para<br><i>Dallana</i></h1><div class=sub>un pedacito de todo lo bonito que eres</div>
<div class=frame><img class=ph src="../../assets/fotos/portada-musica.png"><img class=st src="../../assets/stickers/stikers19.png"></div></div>
<div class=stats><div><b>33</b><span>días juntos</span></div><div><b>12</b><span>recuerdos</span></div><div><b>1</b><span>carta nueva</span></div></div>
<div class=film><div class=strip>
<div style="background:linear-gradient(160deg,#7a2d44,#c4627a)"><em>el primer paseo</em></div>
<div style="background:linear-gradient(160deg,#2f3f6b,#7f9bd6)"><em>lluvia en Conce</em></div>
<div style="background:linear-gradient(160deg,#9a4b2f,#f0a27a)"><em>tu risa</em></div>
<div style="background:linear-gradient(160deg,#3a5a3a,#9bc98a)"><em>cumplemes</em></div></div></div>
<div class=sec><h2>Abre tu carta</h2><p>Hay una nueva esperándote desde hoy.</p><span class=btn>Leer la carta</span></div>

<!doctype html><meta charset=utf-8><meta name=viewport content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;background:#f3e6d3;font-family:'DM Sans';color:#2f2b3a;background-image:radial-gradient(#e6d3b8 1px,transparent 1.4px);background-size:14px 14px;overflow-x:hidden}
.hero{padding:34px 22px 10px;position:relative;text-align:center}
.firma{font-family:Caveat;font-size:22px;color:#a5222e;transform:rotate(-2deg)}
h1{font-family:Fraunces;font-weight:400;font-size:64px;line-height:.95;margin:6px 0 22px;letter-spacing:-1.5px}
h1 i{display:block;font-weight:500;color:#d1343f;font-size:78px}
.pol{background:#fffdf8;padding:14px 14px 56px;width:290px;margin:0 auto;transform:rotate(-3deg);box-shadow:0 2px 3px rgba(80,40,30,.15),0 26px 40px -14px rgba(80,40,30,.4);position:relative}
.pol img.f{width:100%;height:290px;object-fit:cover;display:block}
.pol .cap{position:absolute;bottom:14px;left:0;right:90px;font-family:Caveat;font-size:26px;color:#a5222e}
.tape{position:absolute;top:-14px;left:50%;width:100px;height:30px;margin-left:-50px;background:rgba(239,192,180,.8);transform:rotate(3deg)}
.st1{position:absolute;width:104px;right:-6px;bottom:-34px;transform:rotate(8deg);filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.cnt{margin:50px auto 0;width:300px;background:#fffdf8;border:2px dashed #d1343f55;border-radius:6px;padding:16px;transform:rotate(1.2deg)}
.cnt b{font-family:Fraunces;font-size:44px;color:#d1343f;font-weight:600}
.cnt span{display:block;font-size:14px;color:#696374}
.sec{padding:40px 22px}
.sec h2{font-family:Fraunces;font-weight:500;font-size:30px;margin-bottom:6px}
.sec p.s{font-family:Caveat;font-size:22px;color:#696374;margin-bottom:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 14px}
.p{background:#fffdf8;padding:8px 8px 30px;box-shadow:0 12px 20px -10px rgba(80,40,30,.4);position:relative}
.p:nth-child(1){transform:rotate(-2.5deg)}.p:nth-child(2){transform:rotate(2deg) translateY(16px)}.p:nth-child(3){transform:rotate(1.5deg)}.p:nth-child(4){transform:rotate(-2deg) translateY(16px)}
.p div{height:120px;border-radius:2px}
.p em{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-family:Caveat;font-size:18px;color:#a5222e;font-style:normal}
</style>
<div class=hero>
<div class=firma>una cosita para ti, Dallana ♡</div>
<h1>Para <i>Dallana</i></h1>
<div class=pol><div class=tape></div><img class=f src="../../assets/fotos/portada-musica.png"><div class=cap>nosotros, 17 · 10</div><img class=st1 src="../../assets/stickers/stikers19.png"></div>
<div class=cnt><b>33 días</b><span>juntos, y los que vienen</span></div>
</div>
<div class=sec><h2>Pegados en el álbum</h2><p class=s>cada recuerdo, una foto con su nota</p>
<div class=grid>
<div class=p><div style="background:linear-gradient(135deg,#efc0b4,#e4edfb)"></div><em>el primer paseo</em></div>
<div class=p><div style="background:linear-gradient(135deg,#ffecd9,#efc0b4)"></div><em>lluvia en Conce</em></div>
<div class=p><div style="background:linear-gradient(135deg,#e4edfb,#ffecd9)"></div><em>tu risa</em></div>
<div class=p><div style="background:linear-gradient(135deg,#e6f3df,#efc0b4)"></div><em>cumplemes ♥</em></div>
</div></div>
